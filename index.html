                                        municipalityExt24: item.municipalityExt24,
                                        points: resultPts,
                                        center: computeCenterFromPoints(resultPts),
                                        codewords: item.codewords,
                                        dataBytes: item.dataBytes,
                                        versionNumber: item.versionNumber
                                    };
                                    // 隱ｭ蜿匁悄髯舌メ繧ｧ繝・け
                                    if (firstQR.expiryExt32 !== undefined && !checkExpiry(firstQR.expiryExt32)) {
                                        isScanning = false; isProcessing = false;
                                        showResultScreen(null, "隱ｭ縺ｿ蜿悶ｊ縺ｮ譛牙柑譛滄俣縺檎ｵゆｺ・＠縺ｾ縺励◆");
                                        return;
                                    }
                                    // 隱ｭ蜿也ｫｯ譛ｫID繝√ぉ繝・け
                                    if (firstQR.readerIdExt32 !== undefined) {
                                        if (!matchesRegisteredTerminalId(firstQR.readerIdExt32)) {
                                            isScanning = false; isProcessing = false;
                                            showResultScreen(null, "隱ｭ蜿也ｫｯ譛ｫID縺御ｸ閾ｴ縺励∪縺帙ｓ");
                                            return;
                                        }
                                    }
                                    // 隱ｭ蜿紋ｽ咲ｽｮ繝√ぉ繝・け
                                    if (firstQR.locationLatExt24 !== undefined && firstQR.locationLonExt24 !== undefined) {
                                        const locMatch = await checkLocation(firstQR.locationLatExt24, firstQR.locationLonExt24);
                                        if (!locMatch) {
                                            isScanning = false; isProcessing = false;
                                            showResultScreen(null, "隱ｭ蜿紋ｽ咲ｽｮ縺御ｸ閾ｴ縺励∪縺帙ｓ");
                                            return;
                                        }
                                    }
                                    // 蟶ら伴譚代さ繝ｼ繝峨メ繧ｧ繝・け
                                    if (firstQR.municipalityExt24 !== undefined) {
                                        const muniMatch = await checkMunicipality(firstQR.municipalityExt24);
                                        if (!muniMatch) {
                                            isScanning = false; isProcessing = false;
                                            showResultScreen(null, "蟶ら伴譚代さ繝ｼ繝峨′荳閾ｴ縺励∪縺帙ｓ");
                                            return;
                                        }
                                    }
                                    if (!ensureReadCountAllowed(firstQR)) {
                                        isScanning = false; isProcessing = false;
                                        return;
                                    }
                                } else {
                                    continue; // 縺昴ｌ莉･螟悶・驥崎､・ｪｭ蜿悶・辟｡隕・
                                }

                                // 蠢・ｦ√↑荳｡譁ｹ縺ｮQR縺梧純縺｣縺・竊・髮ｻ蟄千ｽｲ蜷阪・讀懆ｨｼ繧貞ｮ溯｡鯉ｼ亥・騾夐未謨ｰ・・
                                if (firstQR && secondQR) {
                                    await finalizeDigitalSign();
                                    return;
                                }
                                continue;
                            }

                            // 繝・ず繧ｿ繝ｫ鄂ｲ蜷阪〒縺ｯ縺ｪ縺・壼ｸｸ縺ｮStage 3蜃ｦ逅・
                            // 笘・隨ｬ2QR隴伜挨譚｡莉ｶ繧貞ｾ捺擂縺ｮ縲荊ext 蟾ｮ OR mgmtCode 蟾ｮ縲阪°繧・
                            //   縲繋rNo===1 OR 荳ｭ蠢・ｷ晞屬 > min(逕ｻ髱｢蟷・・.1, qrSizeﾃ・.45)縲阪∈蠑ｷ蛹悶・
                            //   縺薙ｌ縺ｫ繧医ｊ縲√す繧ｹ繝・Β證怜捷蛹厄ｼ上Θ繝ｼ繧ｶ證怜捷蛹悶〒 mgmt 荳驛ｨ遐ｴ謳阪ｄ繝・く繧ｹ繝域昭繧峨℃縺・
                            //   襍ｷ縺阪※繧ゅ∫ｩｺ髢鍋噪縺ｫ蛻･菴咲ｽｮ縺ｮ QR 繧堤｢ｺ螳溘↓隨ｬ2QR縺ｨ蛻､螳壹＠縺ｦ蜿悶ｊ縺薙⊂縺輔↑縺・・
                            const candCenter = computeCenterFromPoints(resultPts);
                            const candAdapter2 = { text: resultData, points: resultPts, center: candCenter };
                            ensureFirstCenter(firstQR);
                            const frameW = (video && video.videoWidth) || 1280;
                            const isDiff = isDifferentSecondCandidate(firstQR, candAdapter2, frameW);
                            const isQ2ByMgmt = (qrNo === 1);
                            const isQ1ByMgmt = (qrNo === 0);

                            // 笘・螳牙・邯ｲ・夂ｮ｡逅・さ繝ｼ繝峨〒 qrNo===0・・隨ｬ1QR・峨→遒ｺ螳壹＠縺溘ｉ辟｡譚｡莉ｶ縺ｧ遐ｴ譽・・
                            //   遨ｺ髢楢ｷ晞屬・・sDiff・峨〒繧ｫ繝｡繝ｩ遘ｻ蜍輔↓繧医ｋ隱､蛻､蛻･縺瑚ｵｷ縺阪ｋ縺ｮ繧呈ｹ邨ｶ縺吶ｋ縲・
                            if (!sysEncStage3 && isQ1ByMgmt) continue;

                            // (a) 邂｡逅・さ繝ｼ繝峨〒隨ｬ2QR 縺ｨ遒ｺ螳壹〒縺阪ｋ縲√∪縺溘・
                            // (b) qrNo 縺悟叙蠕嶺ｸ崎・・育ｴ謳搾ｼ峨°縺､遨ｺ髢楢ｷ晞屬縺碁明蛟､莉･荳翫〒蛻･QR縺ｨ蛻､螳壹〒縺阪ｋ
                            // 縺ｮ縺・★繧後°繧呈ｺ縺溘＆縺ｪ縺・↑繧画昏縺ｦ繧九・
                            if (!isQ2ByMgmt && !isDiff) continue;

                            secondQR = { text: resultData, managementCode: resultMgmt, points: resultPts, center: candCenter };
                            isScanning = false;
                            isProcessing = false;
                            showResultScreen();
                            return;
                        }
                    }

                } catch (e) {
                    console.error("繧ｹ繧ｭ繝｣繝ｳ繝ｫ繝ｼ繝励お繝ｩ繝ｼ", e);
                }
                isProcessing = false;
            }

            if (isScanning) requestAnimationFrame(scanLoop);
        }
    </script>
