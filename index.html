        function clampValue(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function normalizeBBox(bbox, maxWidth, maxHeight) {
            if (!bbox) return null;
            const x1 = clampValue(bbox.x, 0, maxWidth);
            const y1 = clampValue(bbox.y, 0, maxHeight);
            const x2 = clampValue(bbox.x + bbox.width, 0, maxWidth);
            const y2 = clampValue(bbox.y + bbox.height, 0, maxHeight);
            if (x2 <= x1 || y2 <= y1) return null;
            return { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
        }

        function mergeBBox(base, addition) {
            if (!addition) return base || null;
            if (!base) {
                return { x: addition.x, y: addition.y, width: addition.width, height: addition.height };
            }
            const x1 = Math.min(base.x, addition.x);
            const y1 = Math.min(base.y, addition.y);
            const x2 = Math.max(base.x + base.width, addition.x + addition.width);
            const y2 = Math.max(base.y + base.height, addition.y + addition.height);
            return { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
        }

        function expandBBox(bbox, padding, maxWidth, maxHeight) {
            if (!bbox) return null;
            return normalizeBBox({
                x: bbox.x - padding,
                y: bbox.y - padding,
                width: bbox.width + padding * 2,
                height: bbox.height + padding * 2
            }, maxWidth, maxHeight);
        }

        function getBBoxArea(bbox) {
            return bbox ? bbox.width * bbox.height : 0;
        }

        function pickLargestBarcodeBBox(barcodes, videoWidth, videoHeight) {
            if (!barcodes || barcodes.length === 0) return null;
            let bestBBox = null;
            for (const barcode of barcodes) {
                if (!barcode || !barcode.boundingBox) continue;
                const normalized = normalizeBBox(barcode.boundingBox, videoWidth, videoHeight);
                if (!normalized) continue;
                if (!bestBBox || getBBoxArea(normalized) > getBBoxArea(bestBBox)) {
                    bestBBox = normalized;
                }
            }
            return bestBBox;
        }

        async function refreshColorScanBBox(videoWidth, videoHeight) {
            if (!barcodeDetector) return;
            const shouldRunDetector = !colorScanBBox || (colorScanAttemptCount % COLOR_DETECT_REFRESH_EVERY === 0);
            if (!shouldRunDetector) return;
            try {
                const barcodes = await barcodeDetector.detect(video);
                const detectedBBox = pickLargestBarcodeBBox(barcodes, videoWidth, videoHeight);
                if (detectedBBox) {
                    colorScanBBox = detectedBBox;
                }
            } catch (err) {
                // Ignore detector errors and fall back to jsQR-based localization.
            }
        }

        function getColorFocusPadding(bbox) {
            return bbox
                ? Math.max(COLOR_BBOX_PADDING, Math.round(Math.max(bbox.width, bbox.height) * 0.45))
                : COLOR_BBOX_PADDING;
        }

        // 笘・focused plan 縺ｮ譛螟ｧ隗｣蜒丞ｺｦ繧ｭ繝｣繝・・・育ｲｾ蠎ｦ縺ｨ縺ｮ繝舌Λ繝ｳ繧ｹ・・
        const COLOR_FOCUSED_CAP_DIM = 720;
        function buildColorFocusedPlan(videoWidth, videoHeight, maxDim = 0) {
            if (!colorScanBBox) return null;
            const focusedBBox = expandBBox(colorScanBBox, getColorFocusPadding(colorScanBBox), videoWidth, videoHeight);
            if (!focusedBBox) return null;
            const sw = Math.max(1, Math.ceil(focusedBBox.width));
            const sh = Math.max(1, Math.ceil(focusedBBox.height));
            // maxDim=0 縺ｮ蝣ｴ蜷医〒繧・COLOR_FOCUSED_CAP_DIM 縺ｧ蛻ｶ髯・
            const effectiveMax = maxDim > 0 ? maxDim : COLOR_FOCUSED_CAP_DIM;
            const scale = Math.min(1, effectiveMax / Math.max(sw, sh));

            return {
                sx: Math.floor(focusedBBox.x),
                sy: Math.floor(focusedBBox.y),
                sw,
                sh,
                targetWidth: Math.max(1, Math.round(sw * scale)),
                targetHeight: Math.max(1, Math.round(sh * scale))
            };
        }

        function buildColorScanPlan(videoWidth, videoHeight) {
            const refreshFullFrame = colorScanAttemptCount > 0 && (colorScanAttemptCount % COLOR_FOCUS_REFRESH_EVERY === 0);
            const focusedPlan = !refreshFullFrame ? buildColorFocusedPlan(videoWidth, videoHeight, 0) : null;
            const useFullFrameFallback = !focusedPlan && (colorScanAttemptCount % COLOR_FULL_SCAN_EVERY === 0);

            if (focusedPlan) return focusedPlan;

            const maxDim = useFullFrameFallback ? COLOR_FULL_MAX_DIM : COLOR_FAST_MAX_DIM;
            const scale = Math.min(1, maxDim / Math.max(videoWidth, videoHeight));
            return {
                sx: 0,
                sy: 0,
                sw: videoWidth,
                sh: videoHeight,
                targetWidth: Math.max(1, Math.round(videoWidth * scale)),
                targetHeight: Math.max(1, Math.round(videoHeight * scale))
            };
        }

        function mapScanBBoxToVideo(localBBox, plan, videoWidth, videoHeight) {
            if (!localBBox) return null;
            const scaleX = plan.sw / plan.targetWidth;
            const scaleY = plan.sh / plan.targetHeight;
            return normalizeBBox({
                x: plan.sx + localBBox.x * scaleX,
                y: plan.sy + localBBox.y * scaleY,
                width: localBBox.width * scaleX,
                height: localBBox.height * scaleY
            }, videoWidth, videoHeight);
        }

        function updateColorScanFocus(localBBox, plan, videoWidth, videoHeight) {
            if (!localBBox) return;
            const mappedBBox = mapScanBBoxToVideo(localBBox, plan, videoWidth, videoHeight);
            if (!mappedBBox) return;
            colorScanBBox = mappedBBox;
            colorScanResult._crop = {
                x: Math.floor(mappedBBox.x),
                y: Math.floor(mappedBBox.y),
                w: Math.ceil(mappedBBox.width),
                h: Math.ceil(mappedBBox.height)
            };
        }

        function runColorScanPlan(plan) {
            zxingCanvas.width = plan.targetWidth;
            zxingCanvas.height = plan.targetHeight;
            zxingCtx.drawImage(video, plan.sx, plan.sy, plan.sw, plan.sh, 0, 0, plan.targetWidth, plan.targetHeight);

            const frameData = zxingCtx.getImageData(0, 0, plan.targetWidth, plan.targetHeight);
            const pixelCount = plan.targetWidth * plan.targetHeight;
            let localBBox = null;

            const needQ1 = !colorScanResult.qr1;
            const needQ2 = !colorScanResult.qr2;
            if (needQ1 || needQ2) {
                const chIdx = getTwin1ChannelIndex(colorEncDarkName, colorEncLightName);
                // 笘・縺ｾ縺夐←蠢懃噪莠悟､蛹厄ｼ・sQR縺ｮbinarizer・峨〒隧ｦ陦・竊・辣ｧ譏弱Β繝ｩ縺ｫ蠑ｷ縺・
                const twin1Mono = buildChannelMonochromeRgba(frameData.data, pixelCount, chIdx);
                const twin1Fast = decodeTargetedColorPair([
                    { data: twin1Mono, inversionAttempts: 'dontInvert', singleLocate: true }
                ], plan.targetWidth, plan.targetHeight, needQ1, needQ2);
                if (twin1Fast && twin1Fast.results) {
                    for (const qr of twin1Fast.results) {
                        assignColorPairResult(colorScanResult, 'qr1', 'qr2', qr);
                    }
                }
                if (twin1Fast && twin1Fast.bbox) {
                    localBBox = mergeBBox(localBBox, twin1Fast.bbox);
                }
                // 笘・驕ｩ蠢懃噪縺ｧ隕九▽縺九ｉ縺ｪ縺九▲縺溷・縺ｯ蝗ｺ螳夐明蛟､莠悟､蛹悶〒繝輔か繝ｼ繝ｫ繝舌ャ繧ｯ
                const fallbackQ1 = !colorScanResult.qr1;
                const fallbackQ2 = !colorScanResult.qr2;
                if (fallbackQ1 || fallbackQ2) {
                    const twin1Bin = buildChannelBinarizedRgba(frameData.data, pixelCount, chIdx, 128);
                    const twin1Fb = decodeTargetedColorPair([
                        { data: twin1Bin, inversionAttempts: 'dontInvert', preBinarized: true, singleLocate: true }
                    ], plan.targetWidth, plan.targetHeight, fallbackQ1, fallbackQ2);
                    if (twin1Fb && twin1Fb.results) {
                        for (const qr of twin1Fb.results) {
                            assignColorPairResult(colorScanResult, 'qr1', 'qr2', qr);
                        }
                    }
                    if (twin1Fb && twin1Fb.bbox) {
                        localBBox = mergeBBox(localBBox, twin1Fb.bbox);
                    }
                }
            }

            // 笘・Twin2縺ｯprocessColorQRTwin縺ｧ蜃ｦ逅・ｼ・win1繝輔か繝ｼ繝ｫ繝舌ャ繧ｯ繧ょ性繧・・
            const stillNeedTwin2 = !(colorScanResult.qr3 && colorScanResult.qr4);
            if (stillNeedTwin2) {
                const colorDecoded = processColorQRTwin(frameData, plan.targetWidth, plan.targetHeight, colorScanResult);
                if (colorDecoded) {
                    mergeColorScanResult(colorDecoded);
                    if (colorDecoded.bbox) {
                        localBBox = mergeBBox(localBBox, colorDecoded.bbox);
                    }
                }
            }

            return {
                localBBox,
                colorCount: countColorScanResult(colorScanResult)
            };
        }

        function countColorScanResult(result) {
            if (!result) return 0;
            let count = 0;
            if (result.qr1) count++;
            if (result.qr2) count++;
            if (result.qr3) count++;
            if (result.qr4) count++;
            return count;
        }

        function mergeColorScanResult(nextResult) {
            if (!colorScanResult) resetColorScanResult();
            if (!nextResult) return colorScanResult;
            for (const key of ['qr1', 'qr2', 'qr3', 'qr4']) {
                if (!colorScanResult[key] && nextResult[key]) {
                    colorScanResult[key] = nextResult[key];
                }
            }
            return colorScanResult;
        }

        // RGB??SV???

                if (qr.readerIdExt32 !== undefined) {
                    if (!matchesRegisteredTerminalId(qr.readerIdExt32)) {
                        target._readerIdFailed = true;
                        return;
                    }
                }
                if (qr.locationLatExt24 !== undefined && qr.locationLonExt24 !== undefined) {
                    if (!currentDevicePosition || !matchLocation(
                        (qr.locationLatExt24 / 10000) - 90,
                        (qr.locationLonExt24 / 10000) - 180,
                        currentDevicePosition.lat,
                        currentDevicePosition.lon
                    )) {
                        target._locationFailed = true;
                        return;
                    }
                }
                // 蟶ら伴譚代さ繝ｼ繝峨メ繧ｧ繝・け・医き繝ｩ繝ｼ繝｢繝ｼ繝臥畑繝ｻ蜷梧悄逧・ｼ・
                if (qr.municipalityExt24 !== undefined) {
                    if (!currentDevicePosition) {
                        target._municipalityFailed = true;
                        return;
                    }
                    // 蜷梧悄繝√ぉ繝・け縺ｯ縺ｧ縺阪↑縺・・縺ｧ縲√ヵ繝ｩ繧ｰ縺縺醍ｫ九※縺ｦ蠕後〒髱槫酔譛溘メ繧ｧ繝・け
                    target._pendingMunicipalityCheck = qr.municipalityExt24;
                }
                const readCountCheck = checkReadCountLimit(qr);
                if (!readCountCheck.ok) {
                    target._readCountFailed = true;
                    target._readCountMessage = readCountCheck.message || '隱ｭ蜿門屓謨ｰ縺後Μ繝溘ャ繝医↓驕斐＠縺ｾ縺励◆';
                    return;
                }
                target._q1Meta = qr;
                target._expiryChecked = true;
            }
            if (zeroMatch) {
                if (!target[zeroKey]) target[zeroKey] = qr.data;
                return;
            }
            if (oneMatch) {
                if (!target[oneKey]) target[oneKey] = qr.data;
                return;
            }
            if (!target[zeroKey]) target[zeroKey] = qr.data;
            else if (!target[oneKey] && target[zeroKey] !== qr.data) target[oneKey] = qr.data;
        }

        function mergeLocationBBox(targetBBox, qr) {
            if (!qr || !qr.location) return targetBBox;
            const points = [
                qr.location.topLeftCorner,
                qr.location.topRightCorner,
                qr.location.bottomRightCorner,
                qr.location.bottomLeftCorner
            ].filter(Boolean);
            if (points.length !== 4) return targetBBox;
            const xs = points.map(point => point.x);
            const ys = points.map(point => point.y);
            return mergeBBox(targetBBox, {
                x: Math.min(...xs),
                y: Math.min(...ys),
                width: Math.max(...xs) - Math.min(...xs),
                height: Math.max(...ys) - Math.min(...ys)
            });
        }

        function processColorQRTwin(imageData, width, height, existingResult = null) {
            const needTwin1 = !(existingResult && existingResult.qr1 && existingResult.qr2);
            const needTwin2 = !(existingResult && existingResult.qr3 && existingResult.qr4);
            if (!needTwin1 && !needTwin2) return null;

            const src = imageData.data;
            const pixelCount = width * height;
            const profiles = getSelectedColorProfiles(colorEncDarkName, colorEncLightName);

            const pBlackR = profiles.black.r, pBlackG = profiles.black.g, pBlackB = profiles.black.b;
            const pDarkR = profiles.dark.r, pDarkG = profiles.dark.g, pDarkB = profiles.dark.b;
            const pLightR = profiles.light.r, pLightG = profiles.light.g, pLightB = profiles.light.b;
            const pWhiteR = profiles.white.r, pWhiteG = profiles.white.g, pWhiteB = profiles.white.b;
            const isDarkBlack = colorEncDarkName === 'black';
            const isLightWhite = colorEncLightName === 'white';
            const isDarkRed = colorEncDarkName === 'red';
            const isDarkCyan = colorEncDarkName === 'cyan';
            const isLightYellow = colorEncLightName === 'yellow';
            const isLightPink = colorEncLightName === 'pink';

            // 笘・Twin1繝輔か繝ｼ繝ｫ繝舌ャ繧ｯ逕ｨ + Twin2逕ｨ縺ｮ繝舌ャ繝輔ぃ
            const twin1StrictData = needTwin1 ? new Uint8ClampedArray(pixelCount * 4) : null;
            const twin2StrictData = needTwin2 ? new Uint8ClampedArray(pixelCount * 4) : null;
            const twin2BiasedData = needTwin2 ? new Uint8ClampedArray(pixelCount * 4) : null;

            for (let i = 0; i < pixelCount; i++) {
                const idx = i * 4;
                const r = src[idx];
                const g = src[idx + 1];
                const b = src[idx + 2];

                const maxRgb = r > g ? (r > b ? r : b) : (g > b ? g : b);
                const minRgb = r < g ? (r < b ? r : b) : (g < b ? g : b);
                const chroma = maxRgb - minRgb;
                const luma = 0.299 * r + 0.587 * g + 0.114 * b;

                let strict, twin2Val;

                if (luma <= 26 && chroma <= 46) {
                    strict = 0;
                    twin2Val = 0;
                } else if (luma >= 238 && chroma <= 38) {
                    strict = 3;
                    twin2Val = 3;
                } else {
                    const blackScore = (r < pBlackR ? pBlackR - r : r - pBlackR) + (g < pBlackG ? pBlackG - g : g - pBlackG) + (b < pBlackB ? pBlackB - b : b - pBlackB) + luma + chroma * 0.18;
                    let darkScore = (r < pDarkR ? pDarkR - r : r - pDarkR) + (g < pDarkG ? pDarkG - g : g - pDarkG) + (b < pDarkB ? pDarkB - b : b - pDarkB) + (40 - chroma > 0 ? (40 - chroma) * 1.25 : 0) + (luma - 225 > 0 ? (luma - 225) * 0.35 : 0);
                    let lightScore = (r < pLightR ? pLightR - r : r - pLightR) + (g < pLightG ? pLightG - g : g - pLightG) + (b < pLightB ? pLightB - b : b - pLightB) + (34 - chroma > 0 ? (34 - chroma) * 1.05 : 0) + (92 - luma > 0 ? (92 - luma) * 0.45 : 0);
                    const whiteScore = (r < pWhiteR ? pWhiteR - r : r - pWhiteR) + (g < pWhiteG ? pWhiteG - g : g - pWhiteG) + (b < pWhiteB ? pWhiteB - b : b - pWhiteB) + (255 - luma) + chroma * 0.12;

                    if (chroma < 30) { darkScore += 28; lightScore += 18; }

                    if (isDarkRed) {
                        const dom = r - (g > b ? g : b);
                        darkScore = dom > 0 ? darkScore - dom * 1.25 : darkScore + (-dom) * 0.12;
                    } else if (isDarkCyan) {
                        const dom = (g < b ? g : b) - r;
                        darkScore = dom > 0 ? darkScore - dom * 1.1 : darkScore + (-dom) * 0.12;
                    }
                    if (isLightYellow) {
                        const dom = (r < g ? r : g) - b;
                        lightScore = dom > 0 ? lightScore - dom * 0.95 : lightScore + (-dom) * 0.12;
                    } else if (isLightPink) {
                        const dom = r - (g < b ? g : b);
                        lightScore = dom > 0 ? lightScore - dom * 0.8 : lightScore + (-dom) * 0.12;
                    }

                    if (isDarkBlack) darkScore = blackScore + 2;
                    if (isLightWhite) lightScore = whiteScore + 2;

                    strict = 0;
                    let bestScore = blackScore;
                    if (darkScore < bestScore) { bestScore = darkScore; strict = 1; }
                    if (lightScore < bestScore) { bestScore = lightScore; strict = 2; }
                    if (whiteScore < bestScore) { strict = 3; }

                    twin2Val = strict;
                    if (strict === 0 && darkScore + 16 < blackScore) twin2Val = 1;
                    else if (strict === 3 && lightScore + 16 < whiteScore) twin2Val = 2;
                }

                // Twin1: black(0) or dark(1) 竊・0, else 255
                if (twin1StrictData) {
                    const v1 = strict <= 1 ? 0 : 255;
                    twin1StrictData[idx] = v1;
                    twin1StrictData[idx + 1] = v1;
                    twin1StrictData[idx + 2] = v1;
                    twin1StrictData[idx + 3] = 255;
                }
                // Twin2: black(0) or light(2) 竊・0, else 255
                if (twin2StrictData) {
                    const vs = (strict === 0 || strict === 2) ? 0 : 255;
                    twin2StrictData[idx] = vs;
                    twin2StrictData[idx + 1] = vs;
                    twin2StrictData[idx + 2] = vs;
                    twin2StrictData[idx + 3] = 255;
                    const vb = (twin2Val === 0 || twin2Val === 2) ? 0 : 255;
                    twin2BiasedData[idx] = vb;
                    twin2BiasedData[idx + 1] = vb;
                    twin2BiasedData[idx + 2] = vb;
                    twin2BiasedData[idx + 3] = 255;
                }
            }

            const result = { qr1: null, qr2: null, qr3: null, qr4: null };
            let detectedBBox = null;

            // 笘・Twin1 繝輔か繝ｼ繝ｫ繝舌ャ繧ｯ・・ast path縺ｧ隕九▽縺九ｉ縺ｪ縺九▲縺溷ｴ蜷医・縺ｿ・・
            if (needTwin1) {
                const needQr1 = !(existingResult && existingResult.qr1);
                const needQr2 = !(existingResult && existingResult.qr2);
                const twin1Targeted = decodeTargetedColorPair([
                    { data: twin1StrictData, inversionAttempts: 'dontInvert', preBinarized: true, singleLocate: true }
                ], width, height, needQr1, needQr2, [0], [1]);
                for (const qr of twin1Targeted.results) {
                    assignColorPairResult(result, 'qr1', 'qr2', qr, 0, 1);
                    detectedBBox = mergeLocationBBox(detectedBBox, qr);
                }
            }

            // Twin2 strict
            if (needTwin2) {
                const needQr3 = !(existingResult && existingResult.qr3);
                const needQr4 = !(existingResult && existingResult.qr4);

                const twin2Targeted = decodeTargetedColorPair([
                    { data: twin2StrictData, inversionAttempts: 'dontInvert', preBinarized: true, singleLocate: true }
                ], width, height, needQr3, needQr4, [2], [3]);
                for (const qr of twin2Targeted.results) {
                    assignColorPairResult(result, 'qr3', 'qr4', qr, 2, 3);
                    detectedBBox = mergeLocationBBox(detectedBBox, qr);
                }

                // Twin2 biased 繝輔か繝ｼ繝ｫ繝舌ャ繧ｯ
                const needBiasedQr3 = needQr3 && !result.qr3;
                const needBiasedQr4 = needQr4 && !result.qr4;
                if (needBiasedQr3 || needBiasedQr4) {
                    const twin2BiasedTargeted = decodeTargetedColorPair([
                        { data: twin2BiasedData, inversionAttempts: 'dontInvert', preBinarized: true, singleLocate: true }
                    ], width, height, needBiasedQr3, needBiasedQr4, [2], [3]);
                    for (const qr of twin2BiasedTargeted.results) {
                        assignColorPairResult(result, 'qr3', 'qr4', qr, 2, 3);
                        detectedBBox = mergeLocationBBox(detectedBBox, qr);
                    }
                }

                // 笘・Ver5邊ｾ蠎ｦ蜷台ｸ・ strict+biased縺ｧ隕九▽縺九ｉ縺ｪ縺九▲縺溷ｴ蜷医∥ttemptBoth縺ｧ荳｡繝・・繧ｿ繧貞・隧ｦ陦・
                const retryQr3 = needQr3 && !result.qr3;
                const retryQr4 = needQr4 && !result.qr4;
                if (retryQr3 || retryQr4) {
                    const twin2Retry = decodeTargetedColorPair([
                        { data: twin2StrictData, inversionAttempts: 'attemptBoth', preBinarized: true, singleLocate: true },
                        { data: twin2BiasedData, inversionAttempts: 'attemptBoth', preBinarized: true, singleLocate: true }
                    ], width, height, retryQr3, retryQr4, [2], [3]);
                    for (const qr of twin2Retry.results) {
                        assignColorPairResult(result, 'qr3', 'qr4', qr, 2, 3);
                        detectedBBox = mergeLocationBBox(detectedBBox, qr);
                    }
                }
            }

            if (detectedBBox) result.bbox = detectedBBox;
            if (!result.qr1 && !result.qr2 && !result.qr3 && !result.qr4) {
                return detectedBBox ? { bbox: detectedBBox } : null;
            }

            return result;
        }

        function showColorResult(data) {
            recordReadCountIfNeeded(data && data._q1Meta);
            renderResultText('colorRes1', data.qr1 || null, '(not found)');
            renderResultText('colorRes2', data.qr2 || null, '(not found)');
            renderResultText('colorRes3', data.qr3 || null, '(not found)');
            renderResultText('colorRes4', data.qr4 || null, '(not found)');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('colorResultScreen').style.display = 'flex';
        }

        function circularHueDistance(a, b) {
            const diff = Math.abs((a || 0) - (b || 0));
            return Math.min(diff, 360 - diff);
        }

        function scoreNewColorCandidate(r, g, b, hsv, luma, chroma, name) {
            const profile = getColorProfile(name);
            let score = distance3(r, g, b, profile);

            if (name === 'black') {
                score += Math.max(0, luma - 72) * 1.45 + chroma * 0.22;
                if (luma <= 42 && chroma <= 80) score -= 38;
                return score;
            }

            if (name === 'white') {
                score += Math.max(0, 198 - luma) * 1.35 + chroma * 0.18;
                if (luma >= 224 && chroma <= 72) score -= 38;
                return score;
            }

            const hueTargets = {
                red: 0,
                blue: 240,
                purple: 300,
                yellow: 60,
                cyan: 185,
                green: 120
            };

            score += Math.max(0, 46 - chroma) * 1.8;
            if ((hsv.s || 0) < 0.12) score += 46;

            const targetHue = hueTargets[name];
            if (targetHue !== undefined) {
                score += circularHueDistance(hsv.h, targetHue) * ((hsv.s || 0) > 0.10 ? 1.05 : 0.45);
            }

            switch (name) {
                case 'red':
                    score = applyChannelDominanceHint(score, r - Math.max(g, b), 1.25);
                    break;
                case 'blue':
                    score = applyChannelDominanceHint(score, b - Math.max(r, g), 1.1);
                    break;
                case 'purple':
                    score = applyChannelDominanceHint(score, Math.min(r, b) - g, 1.05);
                    break;
                case 'yellow':
                    score = applyChannelDominanceHint(score, Math.min(r, g) - b, 1.05);
                    break;
                case 'cyan':
                    score = applyChannelDominanceHint(score, Math.min(g, b) - r, 1.0);
                    break;
                case 'green':
                    score = applyChannelDominanceHint(score, g - Math.max(r, b), 1.05);
                    break;
            }

            return score;
        }

        function classifyNamedColorSample(r, g, b, candidateNames) {
            if (!candidateNames || candidateNames.length === 0) return 'white';
            const hsv = rgbToHsv(r, g, b);
            const luma = 0.299 * r + 0.587 * g + 0.114 * b;
            const chroma = Math.max(r, g, b) - Math.min(r, g, b);

            if (candidateNames.includes('black') && luma <= 18 && chroma <= 70) return 'black';
            if (candidateNames.includes('white') && luma >= 245 && chroma <= 50) return 'white';

            let bestName = candidateNames[0];
            let bestScore = Infinity;
            for (const name of candidateNames) {
                const score = scoreNewColorCandidate(r, g, b, hsv, luma, chroma, name);
                if (score < bestScore) {
                    bestScore = score;
                    bestName = name;
                }
            }
            return bestName;
        }

        function buildTriColorDecoder(colorSpecBits) {
            const selected = [];
            for (let i = 0; i < TRI_COLOR_ORDER.length; i++) {
                if ((colorSpecBits >> (7 - i)) & 1) {
                    selected.push(TRI_COLOR_ORDER[i]);
                }
            }

            const darkCandidates = selected.filter(name => ['black', 'blue', 'red', 'purple'].includes(name));
            const lightCandidates = selected.filter(name => ['yellow', 'cyan', 'green', 'white'].includes(name));
            if (darkCandidates.length < 2 || lightCandidates.length < 2) return null;

            const hasDarkBlack = darkCandidates.includes('black');
            const hasLightWhite = lightCandidates.includes('white');

            let darkHigh;
            let darkLow;
            if (hasDarkBlack) {
                darkHigh = 'black';
                darkLow = darkCandidates.find(name => name !== 'black') || 'blue';
            } else {
                const orderedDarks = darkCandidates.slice().sort((a, b) => TRI_DARK_PRIORITY.indexOf(a) - TRI_DARK_PRIORITY.indexOf(b));
                darkHigh = orderedDarks[0];
                darkLow = orderedDarks[1];
            }

            let lightHigh;
            let lightLow;
            if (hasLightWhite) {
                lightHigh = lightCandidates.find(name => name !== 'white') || 'green';
                lightLow = 'white';
            } else {
                const orderedLights = lightCandidates.slice().sort((a, b) => TRI_LIGHT_PRIORITY.indexOf(a) - TRI_LIGHT_PRIORITY.indexOf(b));
                lightHigh = orderedLights[0];
                lightLow = orderedLights[1];
            }

            const states = {};
            if (hasDarkBlack && hasLightWhite) {
                states.black = [1, 1];
                states[darkLow] = [1, 0];
                states[lightHigh] = [0, 1];
                states.white = [0, 0];
            } else if (!hasDarkBlack) {
                states[darkHigh] = [1, 1];
                states[darkLow] = [1, 0];
                states[lightHigh] = [0, 1];
                states[hasLightWhite ? 'white' : lightLow] = [0, 0];
            } else {
                states.black = [1, 1];
                states[darkLow] = [1, 0];
                states[lightLow] = [0, 1];
                states[lightHigh] = [0, 0];
            }

            return {
                candidates: Array.from(new Set(Object.keys(states))),
                states
            };
        }

        function buildQuadColorDecoder() {
            return {
                candidates: QUAD_COLOR_NAMES.slice(),
                states: {
                    black: [1, 1, 1],
                    blue: [1, 1, 0],
                    red: [1, 0, 1],
                    purple: [1, 0, 0],
                    yellow: [0, 0, 1],
                    cyan: [0, 1, 0],
                    green: [0, 1, 1],
                    white: [0, 0, 0]
                }
            };
        }

        function getNewColorDecoder(mgmtInfo) {
            if (!mgmtInfo) return null;
            if (mgmtInfo.regionCount === 3) return buildTriColorDecoder(mgmtInfo.colorSpecBits);
            if (mgmtInfo.regionCount === 4) return buildQuadColorDecoder();
            return null;
        }

        function averageRgbSample(src, width, height, centerX, centerY, radius) {
            const x0 = Math.max(0, Math.floor(centerX - radius));
            const y0 = Math.max(0, Math.floor(centerY - radius));
            const x1 = Math.min(width - 1, Math.ceil(centerX + radius));
            const y1 = Math.min(height - 1, Math.ceil(centerY + radius));
            let sumR = 0;
            let sumG = 0;
            let sumB = 0;
            let count = 0;

            for (let y = y0; y <= y1; y++) {
                for (let x = x0; x <= x1; x++) {
                    const idx = (y * width + x) * 4;
                    sumR += src[idx];
                    sumG += src[idx + 1];
                    sumB += src[idx + 2];
                    count++;
                }
            }

            if (!count) return { r: 255, g: 255, b: 255 };
            return {
                r: Math.round(sumR / count),
                g: Math.round(sumG / count),
                b: Math.round(sumB / count)
            };
        }

        function buildNewColorAffine(q1Data) {
            if (!q1Data || !q1Data.location || typeof q1Data.version !== 'number') return null;
            const tl = q1Data.location.topLeftCorner;
            const tr = q1Data.location.topRightCorner;
            const bl = q1Data.location.bottomLeftCorner;
            if (!tl || !tr || !bl) return null;

            const moduleCount = 17 + 4 * q1Data.version;
            if (moduleCount <= 0) return null;

            const stepX = {
                x: (tr.x - tl.x) / moduleCount,
                y: (tr.y - tl.y) / moduleCount
            };
            const stepY = {
                x: (bl.x - tl.x) / moduleCount,
                y: (bl.y - tl.y) / moduleCount
            };
            const moduleSize = (
                Math.hypot(stepX.x, stepX.y) +
                Math.hypot(stepY.x, stepY.y)
            ) / 2;

            return {
                tl,
                moduleCount,
                stepX,
                stepY,
                moduleSize,
                sampleRadius: Math.max(
                    1,
                    Math.round(
                        Math.max(1, moduleSize) * 0.16
                    )
                )
            };
        }

        function rotateStateMatrix180(states) {
            const n = states.length;
            const rotated = new Array(n);
            for (let r = 0; r < n; r++) {
                rotated[r] = new Array(n);
                for (let c = 0; c < n; c++) {
                    rotated[r][c] = states[n - 1 - r][n - 1 - c];
                }
            }
            return rotated;
        }

        function sampleNewColorModuleState(src, width, height, affine, decoder, row, col) {
            const probeOffsets = [
                { dx: 0, dy: 0, weight: 3 },
                { dx: -0.18, dy: 0, weight: 1 },
                { dx: 0.18, dy: 0, weight: 1 },
                { dx: 0, dy: -0.18, weight: 1 },
                { dx: 0, dy: 0.18, weight: 1 }
            ];
            const votes = new Map();
            const radius = Math.max(1, Math.round(affine.sampleRadius * 0.85));

            for (const probe of probeOffsets) {
                const fx = affine.tl.x
                    + (col + 0.5 + NEW_COLOR_SHIFT_MODULES + probe.dx) * affine.stepX.x
                    + (row + 0.5 + NEW_COLOR_SHIFT_MODULES + probe.dy) * affine.stepY.x;
                const fy = affine.tl.y
                    + (col + 0.5 + NEW_COLOR_SHIFT_MODULES + probe.dx) * affine.stepX.y
                    + (row + 0.5 + NEW_COLOR_SHIFT_MODULES + probe.dy) * affine.stepY.y;

                if (fx < 0 || fy < 0 || fx >= width || fy >= height) continue;

                const rgb = averageRgbSample(src, width, height, fx, fy, radius);
                const state = classifyNamedColorSample(rgb.r, rgb.g, rgb.b, decoder.candidates);
                votes.set(state, (votes.get(state) || 0) + probe.weight);
            }

            if (votes.size === 0) return 'white';

            let bestState = decoder.candidates[0] || 'white';
            let bestWeight = -1;
            for (const [state, weight] of votes.entries()) {
                if (weight > bestWeight) {
                    bestWeight = weight;
                    bestState = state;
                }
            }
            return bestState;
        }

        function sampleNewColorDisplayStates(src, width, height, q1Data, decoder) {
            const affine = buildNewColorAffine(q1Data);
            if (!affine || !decoder || !decoder.candidates || decoder.candidates.length === 0) return null;

            const states = new Array(affine.moduleCount);
            for (let r = 0; r < affine.moduleCount; r++) {
                states[r] = new Array(affine.moduleCount);
                for (let c = 0; c < affine.moduleCount; c++) {
                    states[r][c] = sampleNewColorModuleState(src, width, height, affine, decoder, r, c);
                }
            }

            return states;
        }

        function getQrLocationBBox(location) {
            if (!location) return null;
            const points = [
                location.topLeftCorner,
                location.topRightCorner,
                location.bottomRightCorner,
                location.bottomLeftCorner
            ].filter(Boolean);
            if (points.length < 3) return null;
            const xs = points.map(point => point.x);
            const ys = points.map(point => point.y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);
            return {
                x: minX,
                y: minY,
                width: Math.max(1, maxX - minX),
                height: Math.max(1, maxY - minY)
            };
        }

        function rectIntersectionArea(a, b) {
            if (!a || !b) return 0;
            const x0 = Math.max(a.x, b.x);
            const y0 = Math.max(a.y, b.y);
            const x1 = Math.min(a.x + a.width, b.x + b.width);
            const y1 = Math.min(a.y + a.height, b.y + b.height);
            if (x1 <= x0 || y1 <= y0) return 0;
            return (x1 - x0) * (y1 - y0);
        }

        function computeShiftedNewColorBounds(q1Data, shiftModules = NEW_COLOR_SHIFT_MODULES) {
            const affine = buildNewColorAffine(q1Data);
            if (!affine || !q1Data || !q1Data.location) return null;

            const tl = q1Data.location.topLeftCorner;
            const tr = q1Data.location.topRightCorner;
            const bl = q1Data.location.bottomLeftCorner;
            const br = q1Data.location.bottomRightCorner || (
                tl && tr && bl ? {
                    x: tr.x + bl.x - tl.x,
                    y: tr.y + bl.y - tl.y
                } : null
            );
            const corners = [tl, tr, br, bl].filter(Boolean);
            if (corners.length < 4) return null;

            const shiftX = (affine.stepX.x + affine.stepY.x) * shiftModules;
            const shiftY = (affine.stepX.y + affine.stepY.y) * shiftModules;
            const shifted = corners.map(point => ({
                x: point.x + shiftX,
                y: point.y + shiftY
            }));
            const xs = shifted.map(point => point.x);
            const ys = shifted.map(point => point.y);

            return {
                x: Math.min(...xs),
                y: Math.min(...ys),
                width: Math.max(1, Math.max(...xs) - Math.min(...xs)),
                height: Math.max(1, Math.max(...ys) - Math.min(...ys)),
                moduleSize: affine.moduleSize || estimateModuleSizeFromQr(q1Data) || 1
            };
        }

        function buildNewColorTwinCropSpecs(width, height, q1Data) {
            const specs = [];
            const seen = new Set();
            const shiftCandidates = [8.5, 8.25, 8.75, 8.0, 9.0];
            const padCandidates = [2.5, 4.0];

            for (const shift of shiftCandidates) {
                const shiftedBounds = computeShiftedNewColorBounds(q1Data, shift);
                if (!shiftedBounds) continue;

                for (const padModules of padCandidates) {
                    const pad = Math.max(10, Math.round(shiftedBounds.moduleSize * padModules));
                    const x = Math.max(0, Math.floor(shiftedBounds.x - pad));
                    const y = Math.max(0, Math.floor(shiftedBounds.y - pad));
                    const right = Math.min(width, Math.ceil(shiftedBounds.x + shiftedBounds.width + pad));
                    const bottom = Math.min(height, Math.ceil(shiftedBounds.y + shiftedBounds.height + pad));
                    const cropWidth = Math.max(1, right - x);
                    const cropHeight = Math.max(1, bottom - y);
                    const key = [x, y, cropWidth, cropHeight].join(':');
                    if (seen.has(key)) continue;
                    seen.add(key);

                    const localLeft = Math.max(0, shiftedBounds.x - x);
                    const localTop = Math.max(0, shiftedBounds.y - y);
                    const localRight = Math.min(cropWidth, shiftedBounds.x + shiftedBounds.width - x);
                    const localBottom = Math.min(cropHeight, shiftedBounds.y + shiftedBounds.height - y);

                    specs.push({
                        x,
                        y,
                        width: cropWidth,
                        height: cropHeight,
                        expectedRect: {
                            x: localLeft,
                            y: localTop,
                            width: Math.max(1, localRight - localLeft),
                            height: Math.max(1, localBottom - localTop)
                        }
                    });
                }
            }

            if (specs.length === 0) {
                specs.push({
                    x: 0,
                    y: 0,
                    width,
                    height,
                    expectedRect: null
                });
            }

            return specs;
        }

        function buildNewColorProjectionBuffers(src, pixelCount, decoder) {
            if (!decoder || !decoder.states) return [];

            const bitCount = Math.max(
                0,
                ...Object.values(decoder.states).map(bits => Array.isArray(bits) ? bits.length : 0)
            );
            if (bitCount <= 0) return [];

            const projected = Array.from({ length: bitCount }, () => {
                const out = new Uint8ClampedArray(pixelCount * 4);
                out.fill(255);
                return out;
            });
            const classifyCandidates = Array.from(new Set(['black', ...decoder.candidates, 'white']));
            const zeroBits = new Array(bitCount).fill(0);
            const blackBits = new Array(bitCount).fill(1);

            for (let idx = 0; idx < pixelCount * 4; idx += 4) {
                const r = src[idx];
                const g = src[idx + 1];
                const b = src[idx + 2];
                const stateName = classifyNamedColorSample(r, g, b, classifyCandidates);
                const stateBits = decoder.states[stateName]
                    || (stateName === 'black' ? blackBits : zeroBits);

                for (let bitIndex = 0; bitIndex < bitCount; bitIndex++) {
                    if (!stateBits[bitIndex]) continue;
                    projected[bitIndex][idx] = 0;
                    projected[bitIndex][idx + 1] = 0;
                    projected[bitIndex][idx + 2] = 0;
                }
            }

            return projected;
        }

        function decodeProjectedNewColorCrop(binaryData, crop, expectedQrNo = null, expectedRect = null, excludeRects = null, jsQrOptions = null) {
            if (!binaryData || !crop) return null;

            const acceptQr = (qr) => {
                if (!qr || !qr.data || qr.isRaw) return false;
                if (expectedQrNo !== undefined && expectedQrNo !== null) {
                    if (!matchesExpectedQrNumber(qr, expectedQrNo)) return false;
                }

                const bbox = getQrLocationBBox(qr.location);
                if (bbox && excludeRects && excludeRects.length > 0) {
                    const bboxArea = bbox.width * bbox.height;
                    const bboxCx = bbox.x + bbox.width / 2;
                    const bboxCy = bbox.y + bbox.height / 2;
                    for (const rect of excludeRects) {
                        if (!rect) continue;
                        const rectArea = rect.width * rect.height;
                        const overlap = rectIntersectionArea(bbox, rect);
                        const inside = bboxCx >= rect.x && bboxCx <= (rect.x + rect.width)
                            && bboxCy >= rect.y && bboxCy <= (rect.y + rect.height);
                        if (inside || overlap >= Math.min(bboxArea, rectArea) * 0.12) {
                            return false;
                        }
                    }
                }

                if (!expectedRect) return true;
                if (!bbox) return true;

                const overlap = rectIntersectionArea(bbox, expectedRect);
                const bboxArea = bbox.width * bbox.height;
                const expectedArea = expectedRect.width * expectedRect.height;
                const bboxCx = bbox.x + bbox.width / 2;
                const bboxCy = bbox.y + bbox.height / 2;
                const expectedCx = expectedRect.x + expectedRect.width / 2;
                const expectedCy = expectedRect.y + expectedRect.height / 2;
                const centerDx = Math.abs(bboxCx - expectedCx);
                const centerDy = Math.abs(bboxCy - expectedCy);
                const sizeMatch = bbox.width >= expectedRect.width * 0.45
                    && bbox.height >= expectedRect.height * 0.45;
                const overlapMatch = overlap >= Math.min(bboxArea, expectedArea) * 0.12;
                const centerMatch = centerDx <= Math.max(12, expectedRect.width * 0.42)
                    && centerDy <= Math.max(12, expectedRect.height * 0.42);

                return sizeMatch && (overlapMatch || centerMatch);
            };

            const scanPasses = [
                { data: binaryData, inversionAttempts: 'dontInvert', preBinarized: true, singleLocate: true, ...(jsQrOptions || {}) },
                { data: binaryData, inversionAttempts: 'attemptBoth', preBinarized: true, singleLocate: true, ...(jsQrOptions || {}) },
                { data: binaryData, inversionAttempts: 'attemptBoth', preBinarized: true, singleLocate: false, ...(jsQrOptions || {}) }
            ];

            for (const scanPass of scanPasses) {
                const qr = decodeSingleColorQr(scanPass, crop.width, crop.height, acceptQr);
                if (qr) return offsetQrResult(qr, crop.offsetX, crop.offsetY);
            }

            return null;
        }

        function buildBitMatrixFromColorStates(states, colorStates, bitIndex) {
            const n = states.length;
            const bits = new Array(n);
            for (let r = 0; r < n; r++) {
                bits[r] = new Array(n);
                for (let c = 0; c < n; c++) {
                    const colorName = states[r][c];
                    const stateBits = colorStates[colorName];
                    bits[r][c] = !!(stateBits && stateBits[bitIndex]);
                }
            }
            return bits;
        }

        function buildSyntheticQrBinary(bitsMatrix, modulePx = NEW_COLOR_SYNTH_MODULE_PX, quiet = NEW_COLOR_SYNTH_QUIET) {
            const n = bitsMatrix.length;
            const size = (n + quiet * 2) * modulePx;
            const data = new Uint8ClampedArray(size * size);
            data.fill(255);

            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    if (!bitsMatrix[r][c]) continue;
                    const startY = (r + quiet) * modulePx;
                    const startX = (c + quiet) * modulePx;
                    for (let y = 0; y < modulePx; y++) {
                        const rowOffset = (startY + y) * size;
                        for (let x = 0; x < modulePx; x++) {
                            data[rowOffset + startX + x] = 0;
                        }
                    }
                }
            }

            return { data, width: size, height: size };
        }

        function decodeSyntheticNewColorQr(bitsMatrix, expectedQrNo, jsQrOptions = null) {
            const synthetic = buildSyntheticQrBinary(bitsMatrix);
            for (const inversionAttempts of ['dontInvert', 'attemptBoth']) {
                const qr = jsQR(synthetic.data, synthetic.width, synthetic.height, {
                    preBinarized: true,
                    inversionAttempts,
                    singleLocate: true,
                    ...(jsQrOptions || {})
                });
                if (!qr || !qr.data || qr.isRaw) continue;
                if (expectedQrNo === undefined || expectedQrNo === null || matchesExpectedQrNumber(qr, expectedQrNo)) {
                    return qr;
                }
            }
            return null;
        }

        function processNewColorQRTwin(imageData, width, height, q1Data, existingResult = null) {
            if (!q1Data || !q1Data.mgmtInfo) return null;
            const decoder = getNewColorDecoder(q1Data.mgmtInfo);
            if (!decoder) return null;
            const q2DecodeOptions = getNewColorRegionDecodeOptions(q1Data.mgmtInfo, 2);
            const q3DecodeOptions = getNewColorRegionDecodeOptions(q1Data.mgmtInfo, 3);
            const q4DecodeOptions = getNewColorRegionDecodeOptions(q1Data.mgmtInfo, 4);

            const result = {
                qr2: null,
                qr3: null,
                qr4: null,
                _q2Seed: existingResult && existingResult._q2Seed ? existingResult._q2Seed : null,
                _q4Seed: existingResult && existingResult._q4Seed ? existingResult._q4Seed : null
            };

            const q1Bounds = getQrLocationBBox(q1Data.location);
            const shiftedBounds = computeShiftedNewColorBounds(q1Data);
            const unionBounds = mergeBBox(q1Bounds, shiftedBounds);
            const moduleSize = (shiftedBounds && shiftedBounds.moduleSize) || estimateModuleSizeFromQr(q1Data) || 4;
            const pad = Math.max(14, Math.round(moduleSize * 4));
            const pairBounds = unionBounds
                ? normalizeBBox({
                    x: unionBounds.x - pad,
                    y: unionBounds.y - pad,
                    width: unionBounds.width + pad * 2,
                    height: unionBounds.height + pad * 2
                }, width, height)
                : { x: 0, y: 0, width, height };
            if (!pairBounds) return result;

            const pairCrop = cropMonochromeRgbaImage(
                imageData.data,
                width,
                height,
                pairBounds.x,
                pairBounds.y,
                pairBounds.width,
                pairBounds.height
            );
            const projectedBuffers = buildNewColorProjectionBuffers(
                pairCrop.data,
                pairCrop.width * pairCrop.height,
                decoder
            );
            if (projectedBuffers.length === 0) return result;

            const sampledStates = sampleNewColorDisplayStates(imageData.data, width, height, q1Data, decoder);
            if (sampledStates) {
                if ((!existingResult || !existingResult.qr2) && decoder.states && projectedBuffers[0]) {
                    const qr2Synth = decodeSyntheticNewColorQr(
                        buildBitMatrixFromColorStates(sampledStates, decoder.states, 0),
                        1,
                        q2DecodeOptions
                    );
                    if (qr2Synth) result.qr2 = qr2Synth.data;
                }
                const hasQ3Seed = !!(result._q2Seed || (existingResult && existingResult._q2Seed));
                if (hasQ3Seed && (!existingResult || !existingResult.qr3) && decoder.states && projectedBuffers[1]) {
                    const qr3Synth = decodeSyntheticNewColorQr(
                        buildBitMatrixFromColorStates(sampledStates, decoder.states, 1),
                        2,
                        q3DecodeOptions
                    );
                    if (qr3Synth) result.qr3 = qr3Synth.data;
                }
                const hasQ4Seed = !!(result._q4Seed || (existingResult && existingResult._q4Seed));
                if (hasQ4Seed && q1Data.mgmtInfo.regionCount === 4 && (!existingResult || !existingResult.qr4) && decoder.states && projectedBuffers[2]) {
                    const qr4Synth = decodeSyntheticNewColorQr(
                        buildBitMatrixFromColorStates(sampledStates, decoder.states, 2),
                        3,
                        q4DecodeOptions
                    );
                    if (qr4Synth) result.qr4 = qr4Synth.data;
                }
            }

            const runPairDecode = (binaryData, needZero, needOne, jsQrOptions = null) => decodeTargetedColorPair([
                { data: binaryData, inversionAttempts: 'dontInvert', preBinarized: true, singleLocate: true, ...(jsQrOptions || {}) },
                { data: binaryData, inversionAttempts: 'attemptBoth', preBinarized: true, singleLocate: true, ...(jsQrOptions || {}) }
            ], pairCrop.width, pairCrop.height, needZero, needOne);

            if ((!existingResult || !existingResult.qr2) && projectedBuffers[0]) {
                const pairResult = runPairDecode(projectedBuffers[0], true, true, q2DecodeOptions);
                if (pairResult && pairResult.results) {
                    for (const qr of pairResult.results) {
                        const adjusted = offsetQrResult(qr, pairCrop.offsetX, pairCrop.offsetY);
                        if (matchesExpectedQrNumber(adjusted, 1) && !result.qr2) {
                            result.qr2 = adjusted.data;
                            result._q2Seed = adjusted;
                        }
                    }
                }
            }

            if (q1Data.mgmtInfo.regionCount === 4 && (!existingResult || !existingResult.qr4) && projectedBuffers[2]) {
                const pairResult = runPairDecode(projectedBuffers[2], true, true, q4DecodeOptions);
                if (pairResult && pairResult.results) {
                    for (const qr of pairResult.results) {
                        const adjusted = offsetQrResult(qr, pairCrop.offsetX, pairCrop.offsetY);
                        if (matchesExpectedQrNumber(adjusted, 3) && !result.qr4) {
                            result.qr4 = adjusted.data;
                            result._q4Seed = adjusted;
                        }
                    }
                }
            }

            let expectedColorRect = null;
            const seedQr = result._q2Seed || result._q4Seed;
            if (seedQr && seedQr.location) {
                const seedBounds = getQrLocationBBox(seedQr.location);
                if (seedBounds) {
                    expectedColorRect = normalizeBBox({
                        x: seedBounds.x - pairCrop.offsetX,
                        y: seedBounds.y - pairCrop.offsetY,
                        width: seedBounds.width,
                        height: seedBounds.height
                    }, pairCrop.width, pairCrop.height);
                }
            }
            if (!expectedColorRect && shiftedBounds) {
                expectedColorRect = normalizeBBox({
                    x: shiftedBounds.x - pairCrop.offsetX,
                    y: shiftedBounds.y - pairCrop.offsetY,
                    width: shiftedBounds.width,
                    height: shiftedBounds.height
                }, pairCrop.width, pairCrop.height);
            }

            if (!result.qr2 && (!existingResult || !existingResult.qr2) && projectedBuffers[0]) {
                const qr2 = decodeProjectedNewColorCrop(projectedBuffers[0], pairCrop, 1, expectedColorRect, null, q2DecodeOptions);
                if (qr2) {
                    result.qr2 = qr2.data;
                    result._q2Seed = qr2;
                    const seedBounds = getQrLocationBBox(qr2.location);
                    if (seedBounds) {
                        expectedColorRect = normalizeBBox({
                            x: seedBounds.x - pairCrop.offsetX,
                            y: seedBounds.y - pairCrop.offsetY,
                            width: seedBounds.width,
                            height: seedBounds.height
                        }, pairCrop.width, pairCrop.height);
                    }
                }
            }

            if (!result.qr3 && (!existingResult || !existingResult.qr3) && projectedBuffers[1]) {
                const qr3 = decodeProjectedNewColorCrop(projectedBuffers[1], pairCrop, 2, expectedColorRect, null, q3DecodeOptions);
                if (qr3) result.qr3 = qr3.data;
            }

            if (q1Data.mgmtInfo.regionCount === 4 && !result.qr4 && (!existingResult || !existingResult.qr4) && projectedBuffers[2]) {
                const qr4 = decodeProjectedNewColorCrop(projectedBuffers[2], pairCrop, 3, expectedColorRect, null, q4DecodeOptions);
                if (qr4) {
                    result.qr4 = qr4.data;
                    result._q4Seed = qr4;
                }
            }

            const needFullFrameFallback = (!result.qr2 && (!existingResult || !existingResult.qr2))
                || (!result.qr3 && (!existingResult || !existingResult.qr3))
                || (q1Data.mgmtInfo.regionCount === 4 && !result.qr4 && (!existingResult || !existingResult.qr4));
            if (needFullFrameFallback) {
                const fullCrop = { data: imageData.data, width, height, offsetX: 0, offsetY: 0 };
                const fullProjected = buildNewColorProjectionBuffers(imageData.data, width * height, decoder);
                const fullExcludeRects = q1Bounds ? [q1Bounds] : null;
                if (!result.qr2 && (!existingResult || !existingResult.qr2) && fullProjected[0]) {
                    const qr2 = decodeProjectedNewColorCrop(fullProjected[0], fullCrop, 1, null, fullExcludeRects, q2DecodeOptions);
                    if (qr2) {
                        result.qr2 = qr2.data;
                        result._q2Seed = qr2;
                    }
                }

                let fullExpectedRect = null;
                const fullSeed = result._q2Seed || result._q4Seed || (existingResult && (existingResult._q2Seed || existingResult._q4Seed));
                if (fullSeed && fullSeed.location) {
                    fullExpectedRect = getQrLocationBBox(fullSeed.location);
                }

                if (!result.qr3 && (!existingResult || !existingResult.qr3) && fullProjected[1]) {
                    const qr3 = decodeProjectedNewColorCrop(fullProjected[1], fullCrop, 2, fullExpectedRect, fullExcludeRects, q3DecodeOptions);
                    if (qr3) result.qr3 = qr3.data;
                }
                if (q1Data.mgmtInfo.regionCount === 4 && !result.qr4 && (!existingResult || !existingResult.qr4) && fullProjected[2]) {
                    const qr4 = decodeProjectedNewColorCrop(fullProjected[2], fullCrop, 3, fullExpectedRect, fullExcludeRects, q4DecodeOptions);
                    if (qr4) {
                        result.qr4 = qr4.data;
                        result._q4Seed = qr4;
                    }
                }
            }

            if (q1Data.mgmtInfo && q1Data.mgmtInfo.dataCompBits === 0 && result.qr3 && q1Data.text && result.qr3 === q1Data.text) {
                result.qr3 = null;
            }

            return result;
        }

        function countNewColorStageResult(result, mgmtInfo) {
            if (!result || !mgmtInfo) return 1;
            let count = 1;
            if (result.qr2) count++;
            if (result.qr3) count++;
            if (mgmtInfo.regionCount === 4 && result.qr4) count++;
            return count;
        }

        function isNewColorStageComplete(result, mgmtInfo) {
            if (!result || !mgmtInfo) return false;
            if (!result.qr2 || !result.qr3) return false;
            if (mgmtInfo.regionCount === 4 && !result.qr4) return false;
            return true;
        }

        function parseStandardMgmt(managementCode, managementFlags16 = null) {
            const managementCode32 = getManagementCode32FromParts(managementCode, managementFlags16);
            if (managementCode32 === null) return null;
            const high = (managementCode32 >>> 16) & 0xFFFF;
            const low = managementCode32 & 0xFFFF;
            return {
                qrNo: (high >>> 14) & 0x3,
                colorCountBits: (high >>> 12) & 0x3,
                colorSpecBits: (high >>> 4) & 0xFF,
                dataCompBits: (high >>> 2) & 0x3,
                regionIndexBits: high & 0x3,
                sameDataFlag: ((low >>> 15) & 1) === 1,
                encryptionBits: (low >>> 13) & 0x3,
                sysEncFlag: ((low >>> 14) & 1) === 1,
                appEncFlag: ((low >>> 13) & 1) === 1,
                dataTypeBits: (low >>> 10) & 0x7,
                hasDateTime: (low & 0x0200) !== 0,
                hasExpiry: (low & 0x0100) !== 0,
                hasReaderId: (low & 0x0080) !== 0,
                hasImageId: (low & 0x0040) !== 0,
                hasLocation: (low & 0x0020) !== 0,
                hasMunicipality: (low & 0x0010) !== 0,
                readLimitBits: (low >>> 2) & 0x3
            };
        }

        // 笘・譁ｰ繧ｫ繝ｩ繝ｼ隨ｦ蜿ｷ蛹悶Δ繝ｼ繝峨・邂｡逅・ン繝・ヨ隗｣譫・
        function parseNewColorMgmt(managementCode, managementFlags16 = 0) {
            const base = parseStandardMgmt(managementCode, managementFlags16);
            if (!base) return null;
            let regionCount = 2;
            if (base.colorCountBits === 2) regionCount = 3; // 10 = 4濶ｲ = 3-region
            if (base.colorCountBits === 3) regionCount = 4; // 11 = 8濶ｲ = 4-region
            return {
                ...base,
                regionCount
            };
        }

        function newColorModeNeedsPassword(mgmtInfo) {
            return !!(mgmtInfo && (mgmtInfo.dataCompBits === 2 || mgmtInfo.dataCompBits === 3));
        }

        function isNewColorRegionEncrypted(mgmtInfo, regionNo) {
            if (!mgmtInfo) return false;
            if (mgmtInfo.dataCompBits === 2) {
                return regionNo >= 2 && regionNo <= mgmtInfo.regionCount;
            }
            if (mgmtInfo.dataCompBits === 3) {
                if (mgmtInfo.regionCount === 3) return regionNo === 2;
                if (mgmtInfo.regionCount === 4) return regionNo === 2 || regionNo === 3;
            }
            return false;
        }

        function getNewColorRegionDecodeOptions(mgmtInfo, regionNo) {
            if (appMask && isNewColorRegionEncrypted(mgmtInfo, regionNo)) {
                return { appEncMask: Array.from(appMask), sysEncDecode: true };
            }
            return null;
        }

        function verifyNewColorSignature(signatureText, payloadText, q1Meta) {
            const hasImageDataId = !!(q1Meta && q1Meta.managementExt32);
            if (!signatureText) {
                return { verified: false, senderName: '署名データなし', imageDataId: q1Meta && q1Meta.managementExt32 ? q1Meta.managementExt32 : 0, hasImageDataId };
            }

            try {
                const binaryStr = atob(signatureText);
                if (binaryStr.length !== 42) throw new Error('Invalid signature length');
                const signBytes = new Uint8Array(42);
                for (let i = 0; i < 42; i++) signBytes[i] = binaryStr.charCodeAt(i);

                const keyId = (signBytes[0] << 8) | signBytes[1];
                const sigR = signBytes.slice(2, 22);
                const sigS = signBytes.slice(22, 42);
                const pubKeyHex = ECDSA_PUBLIC_KEYS[keyId];
                const senderName = ECDSA_SENDER_NAMES[keyId] || `ID:${keyId}`;
                const verified = !!(pubKeyHex && ecdsaVerify(new TextEncoder().encode(payloadText || ''), sigR, sigS, pubKeyHex));
                return {
                    verified,
                    senderName,
                    keyId,
                    imageDataId: q1Meta && q1Meta.managementExt32 ? q1Meta.managementExt32 : 0,
                    hasImageDataId
                };
            } catch (err) {
                return {
                    verified: false,
                    senderName: '鄂ｲ蜷崎ｧ｣譫舌お繝ｩ繝ｼ',
                    imageDataId: q1Meta && q1Meta.managementExt32 ? q1Meta.managementExt32 : 0,
                    hasImageDataId
                };
            }
        }

        // 笘・譁ｰ繧ｫ繝ｩ繝ｼ隨ｦ蜿ｷ蛹悶Δ繝ｼ繝臥ｵ先棡逕ｻ髱｢陦ｨ遉ｺ
        function showNewColorResult(q1Text, q2Text, q3Text, q4Text, mgmtInfo, q1Meta = null) {
            recordReadCountIfNeeded(q1Meta);
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            isScanning = false;

            const regionCount = mgmtInfo ? mgmtInfo.regionCount : 3;
            const dataComp = mgmtInfo ? mgmtInfo.dataCompBits : 0;

            // 繧ｿ繧､繝医Ν譖ｴ譁ｰ
            const titleEl = document.getElementById('newColorResultTitle');
            if (regionCount === 4) {
                titleEl.innerText = '新カラー符号化 読取結果（4領域）';
            } else {
                titleEl.innerText = '新カラー符号化 読取結果（3領域）';
            }

            // 鬆伜沺諠・ｱ
            const infoEl = document.getElementById('newColorRegionInfo');
            const compLabels = ['通常', '連続データ', 'ユーザ暗号化', '暗号化/署名'];
            infoEl.innerText = regionCount + '領域 / データ構成: ' + (compLabels[dataComp] || '不明');

            const card1 = document.getElementById('newColorRes1Card');

                        //   邂｡逅・さ繝ｼ繝峨・ qrNo 縺ｯ隱､繧願ｨよｭ｣貂医∩縺ｮ遒ｺ螳壽ュ蝣ｱ縺ｪ縺ｮ縺ｧ縲〈rNo===0 縺檎｢ｺ隱阪〒縺阪◆
                        //   繧｢繧､繝・Β縺ｯ辟｡譚｡莉ｶ縺ｧ髯､螟悶＠縺ｦ隱､蛻､蛻･繧呈ｹ邨ｶ縺吶ｋ縲・
                        detectedItems = detectedItems.filter(item => {

                                ? (item.managementCode32 >>> 0)

                            return !(info && info.qrNo === 0);

                        detectedItems.sort((a, b) => {
                            const am32 = a.managementCode32 !== undefined && a.managementCode32 !== null
                                ? (a.managementCode32 >>> 0)
                                : getManagementCode32FromParts(a.managementCode, a.managementFlags16);
                            const bm32 = b.managementCode32 !== undefined && b.managementCode32 !== null
                                ? (b.managementCode32 >>> 0)
                                : getManagementCode32FromParts(b.managementCode, b.managementFlags16);
                            const aInfo = parseStandardMgmt(am32);
                            const bInfo = parseStandardMgmt(bm32);
                            const aIsQ2 = !!(aInfo && aInfo.qrNo === 1);
                            const bIsQ2 = !!(bInfo && bInfo.qrNo === 1);
                            if (aIsQ2 && !bIsQ2) return -1;
                            if (bIsQ2 && !aIsQ2) return 1;

                    // --- [繝輔ぉ繝ｼ繧ｺ 1.5 / 蟆上＆縺・QR 繝・う繝ｳ逕ｨ 繝槭Ν繝√せ繧ｱ繝ｼ繝ｫ荳ｭ螟ｮ繧ｯ繝ｭ繝・・] ---
                    // 縲群R繝・う繝ｳ縺ｮ繧ｵ繧､繧ｺ縺悟ｰ上＆縺・ｼ・?縺ｮ3陦檎岼・・陦檎岼縺ｪ縺ｩ・峨阪→
                    //   繝ｻBarcodeDetector 縺・full-frame 縺ｧ縺ｯ隕九▽縺代↓縺上＞・郁｢ｫ蜀吩ｽ薙′蟆上＆縺吶℃繧具ｼ・
                    //   繝ｻ繝ｦ繝ｼ繧ｶ縺後き繝｡繝ｩ繧堤黄逅・噪縺ｫ霑代▼縺代ｋ縺ｨ謇区険繧後・繝斐Φ繝医′蜷医ｏ縺ｪ縺・
                    // 繧定ｵｷ縺薙☆縲ゅ％繧後ｒ謨代≧縺溘ａ縺ｫ縲√ヵ繝ｬ繝ｼ繝荳ｭ螟ｮ繧・60% / 40% 縺ｪ縺ｩ縺ｫ蛻・ｊ謚懊＞縺ｦ
                    // 縲悟ｮ溯ｳｪ逧・↓繝・ず繧ｿ繝ｫ繧ｺ繝ｼ繝縺励◆逕ｻ蜒上阪ｒ BarcodeDetector 縺ｫ貂｡縺励・
                    // 讀懷・縺ｧ縺阪◆繧・**蜈・ｧ｣蜒丞ｺｦ** 縺九ｉ隧ｲ蠖馴伜沺繧帝ｫ倩ｧ｣蜒丞ｺｦ繧ｯ繝ｭ繝・・縺励※ jsQR 縺ｧ蠕ｩ蜿ｷ縺吶ｋ縲・
                    //
                    // 1繝輔Ξ繝ｼ繝縺ゅ◆繧・1 繧ｹ繧ｱ繝ｼ繝ｫ縺縺代ｒ隧ｦ陦後＠縲√ヵ繝ｬ繝ｼ繝豈弱↓蟾｡蝗槭☆繧九・縺ｧ
                    // 讀懷・繝ｫ繝ｼ繝励・鬮倬滓ｧ縺ｯ菫昴■縺､縺､縲∬､・焚繧ｵ繧､繧ｺ縺ｮ QR 繧貞插遲峨↓繧ｫ繝舌・縺ｧ縺阪ｋ縲・
                    if (detectedItems.length === 0 && useNativeDetector && barcodeDetector) {

                        const scale = SMALL_QR_CROP_SCALES[smallQrCropFrameIdx % SMALL_QR_CROP_SCALES.length];

                                const barcodes = await timedDetect('繝輔ぉ繝ｼ繧ｺ1.5 荳ｭ螟ｮ繧ｯ繝ｭ繝・・BarcodeDetector', zxingCanvas);
                                recordBarcodeDetections('繝輔ぉ繝ｼ繧ｺ1.5 荳ｭ螟ｮ繧ｯ繝ｭ繝・・BarcodeDetector', barcodes ? barcodes.length : 0);
                                recordBarcodeBoxes('繝輔ぉ繝ｼ繧ｺ1.5 荳ｭ螟ｮ繧ｯ繝ｭ繝・・BarcodeDetector', barcodes, scanStage, 'centerCanvas');
                                if (barcodes && barcodes.length > 0) {
                                    for (let i = 0; i < barcodes.length; i++) {

                                        // 繧ｯ繝ｭ繝・・繧ｭ繝｣繝ｳ繝舌せ蜀・ｺｧ讓・竊・蜈・虚逕ｻ蠎ｧ讓吶∈繧ｪ繝輔そ繝・ヨ
                                        const PADDING = Math.max(40, Math.floor(bb.width * 0.5));
                                        const dsx = Math.max(0, Math.floor(bb.x + sx) - PADDING);
                                        const dsy = Math.max(0, Math.floor(bb.y + sy) - PADDING);
                                        const dsw = Math.min(vw - dsx, Math.ceil(bb.width) + PADDING * 2);
                                        const dsh = Math.min(vh - dsy, Math.ceil(bb.height) + PADDING * 2);

                                        // 笘・P1: 蠕ｩ蜿ｷ隕丞援縺ｩ縺翫ｊ縺ｮ baseOpts 繧堤ｵ・∩縲∝､壻ｺ悟､蛹悶〒繧ｯ繝ｭ繝・・蠕ｩ蜿ｷ・亥・隗｣蜒丞ｺｦ縺九ｉ蜀阪け繝ｭ繝・・・・
                                        const baseOpts = { multi: true };

                                        }

                                            '繝輔ぉ繝ｼ繧ｺ1.5 荳ｭ螟ｮ繧ｯ繝ｭ繝・・BarcodeDetector', moduleHint, (scanStage === 1 ? 0 : 1));
                                    }

                    // --- [繝輔ぉ繝ｼ繧ｺ 1.6 / P0-3] 繝阪う繝・ぅ繝烹D荳咲匱譎ゅ・蠎穂ｸ翫￡・井ｺ悟､蛹膨anvas繝ｻ90ﾂｰ蝗櫁ｻ｢canvas縺ｸBD蜀肴兜蜈･・・---
                    //   邵ｦ謖√■遲峨〒繝阪う繝・ぅ繝烹D縺・莉ｶ縺ｮ縺ｨ縺阪・a)Sauvola莠悟､蛹・(b)90ﾂｰ蝗櫁ｻ｢ 縺励◆邵ｮ蟆縦anvas繧・
                    //   BarcodeDetector 縺ｫ荳弱∴縺ｦ菴咲ｽｮ讀懷・繧貞叙繧顔峩縺励∝ｽ薙◆繧後・蜈・ｧ｣蜒丞ｺｦ縺九ｉ螟壻ｺ悟､蛹悶〒繧ｯ繝ｭ繝・・蠕ｩ蜿ｷ縺吶ｋ縲・
                    //   蠕ｩ蜿ｷ隕丞援縺ｯ蜷・Δ繝ｼ繝画ｺ匁侠・・tage1=隨ｬ1QR蟷ｳ譁・/ sysenc遲峨・蟇ｾ蠢懊ヵ繝ｩ繧ｰ・峨・
                    if (detectedItems.length === 0 && barcodeDetector
                        && (scanStage === 1 || (scanStage === 3 && (needSysEncForStage3 || needSysEncForDigitalSign || appMask || scanMode === 'normal')))) {
                        try {
                            const vw = video.videoWidth, vh = video.videoHeight;
                            const FB_MAX = 1280;
                            const fbScale = Math.min(1, FB_MAX / Math.max(vw, vh));
                            const cw = Math.max(1, Math.round(vw * fbScale));
                            const ch = Math.max(1, Math.round(vh * fbScale));
                            const invS = 1 / fbScale;
                            zxingCanvas.width = cw; zxingCanvas.height = ch;
                            zxingCtx.drawImage(video, 0, 0, cw, ch);
                            const baseRGBA = zxingCtx.getImageData(0, 0, cw, ch);

                            if (!_bdAuxCanvas) {
                                _bdAuxCanvas = document.createElement('canvas');
                                _bdAuxCtx = _bdAuxCanvas.getContext('2d', { willReadFrequently: true });
                            }
                            // 蠖楢ｩｲ繧ｯ繝ｭ繝・・縺ｮ蠕ｩ蜿ｷ繧ｪ繝励す繝ｧ繝ｳ・医Δ繝ｼ繝芽ｦ丞援縺ｩ縺翫ｊ・・
                            const decOpts = { multi: true };
                            if (scanStage === 3) {

                            if (false) {
                            const sb = buildSauvolaBinaryFromRGBA(baseRGBA.data, cw, ch, 0);

                            for (let i = 0, j = 0; i < sb.length; i++, j += 4) {
                                const v = sb[i]; sbRGBA[j] = v; sbRGBA[j + 1] = v; sbRGBA[j + 2] = v; sbRGBA[j + 3] = 255;

                    // --- [繝輔ぉ繝ｼ繧ｺ 2] BarcodeDetector菴咲ｽｮ讀懷・ + jsQR繧ｯ繝ｭ繝・・蠕ｩ蜿ｷ (appMask蟆ら畑繝上う繝悶Μ繝・ラ) ---

                    if (detectedItems.length === 0 && barcodeDetector && scanStage === 3 && appMask) {

                            recordBarcodeDetections('繝輔ぉ繝ｼ繧ｺ2 appMask BarcodeDetector繧ｯ繝ｭ繝・・', barcodes ? barcodes.length : 0);
                            recordBarcodeBoxes('繝輔ぉ繝ｼ繧ｺ2 appMask BarcodeDetector繧ｯ繝ｭ繝・・', barcodes, scanStage, 'video');
                            if (barcodes && barcodes.length > 0) {
                                // 笘・P1: 繝ｦ繝ｼ繧ｶ證怜捷蛹・appMask)繧ょ､壻ｺ悟､蛹悶〒繧ｯ繝ｭ繝・・蠕ｩ蜿ｷ繧貞ｺ穂ｸ翫￡
                                for (let i = 0; i < barcodes.length; i++) {
                                    const b = barcodes[i];
                                    const bbox = b.boundingBox;
                                    const PADDING = Math.max(80, Math.floor(bbox.width * 0.6));
                                    const sx = Math.max(0, Math.floor(bbox.x) - PADDING);
                                    const sy = Math.max(0, Math.floor(bbox.y) - PADDING);
                                    const sw = Math.min(video.videoWidth - sx, Math.ceil(bbox.width) + PADDING * 2);
                                    const sh = Math.min(video.videoHeight - sy, Math.ceil(bbox.height) + PADDING * 2);
                                    const moduleHint = Math.max(2, Math.floor(Math.min(sw, sh) / 37));
                                    decodeCropIntoItems(detectedItems, sx, sy, sw, sh,
                                        { appEncMask: Array.from(appMask), sysEncDecode: true, multi: true },
                                        '繝輔ぉ繝ｼ繧ｺ2 appMask BarcodeDetector繧ｯ繝ｭ繝・・', moduleHint, 1);
                                }
                            }

                    // --- [繝輔ぉ繝ｼ繧ｺ 2.5] Stage 1菴咲ｽｮ蜀榊茜逕ｨ + jsQR繧ｯ繝ｭ繝・・蠕ｩ蜿ｷ (莠碁㍾證怜捷蛹悶↑縺ｩBarcodeDetector螟ｱ謨玲凾逕ｨ) ---
                    // Stage 1縺ｧ譌｢縺ｫ繝・う繝ｳ縺ｮ蠎ｧ讓吶ｒ蜿門ｾ励＠縺ｦ縺・ｋ縺溘ａ縲√◎縺ｮ蜻ｨ霎ｺ縺縺代ｒ謗｢縺吶％縺ｨ縺ｧ繝輔Ν繧ｹ繧ｯ繝ｪ繝ｼ繝ｳ繧貞屓驕ｿ縺吶ｋ
                    if (detectedItems.length === 0 && scanStage === 3 && (appMask || digitalSignStage3 || scanMode === 'normal') && lastTwinBBox) {
                        const bbox = lastTwinBBox;
                        // 笘・繧｢繧ｹ繝壹け繝域ｯ斐ｒ隕九※繝代ョ繧｣繝ｳ繧ｰ繧貞・譖ｿ縺医ｋ
                        //   繝ｻbbox 縺梧ｭ｣譁ｹ蠖｢縺ｫ霑代＞ 竊・隨ｬ1QR 蜊倅ｽ薙ｒ謐墓拷縺励※縺・ｋ蜿ｯ閭ｽ諤ｧ縺碁ｫ倥＞縺ｮ縺ｧ
                        //     隨ｬ2QR 縺悟性縺ｾ繧後ｋ繧医≧ **螟ｧ縺阪￥**・育洒霎ｺ縺ｮ 1.2 蛟搾ｼ峨ヱ繝・ぅ繝ｳ繧ｰ
                        //   繝ｻbbox 縺檎ｴｰ髟ｷ縺・          竊・譌｢縺ｫ繝・う繝ｳ蜈ｨ菴薙ｒ隕・≧ UNION 縺ｪ縺ｮ縺ｧ
                        //     繧ｫ繝｡繝ｩ謠ｺ繧後ｒ蜷ｸ蜿弱☆繧句・縺縺・**謗ｧ縺医ａ縺ｫ**・育洒霎ｺ縺ｮ 0.4 蛟搾ｼ峨ヱ繝・ぅ繝ｳ繧ｰ
                        const _w = bbox.width, _h = bbox.height;
                        const _minDim = Math.min(_w, _h);
                        const _aspect = Math.max(_w, _h) / Math.max(1, _minDim);
                        const PADDING = (_aspect >= 1.5)
                            ? Math.max(80,  Math.floor(_minDim * 0.4))
                            : Math.max(120, Math.floor(_minDim * 1.2));
                        const sx = Math.max(0, Math.floor(bbox.x) - PADDING);
                        const sy = Math.max(0, Math.floor(bbox.y) - PADDING);
                        const sw = Math.min(video.videoWidth - sx, Math.ceil(bbox.width) + PADDING * 2);
                        const sh = Math.min(video.videoHeight - sy, Math.ceil(bbox.height) + PADDING * 2);

                        if (sw > 0 && sh > 0) {
                            zxingCanvas.width = sw;
                            zxingCanvas.height = sh;
                            zxingCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
                            const imgData = zxingCtx.getImageData(0, 0, sw, sh);
                            markJsQrCropRect(sx, sy, sw, sh, '繝輔ぉ繝ｼ繧ｺ2.5 lastTwinBBox繧ｯ繝ｭ繝・・');

                            const cropOpts = {
                                inversionAttempts: QR_INV_PRIMARY,
                                multi: true
                            };
                            if (appMask) {
                                cropOpts.appEncMask = Array.from(appMask);
                                cropOpts.sysEncDecode = true;
                            } else if (digitalSignStage3 || sysEncStage3) {
                                cropOpts.sysEncDecode = true;
                            }
                            const cropResList = jsQR(imgData.data, sw, sh, cropOpts);

                            if (cropResList && cropResList.length > 0) {
                                for (const cropRes of cropResList) {
                                    if (cropRes && cropRes.data && !cropRes.isRaw) {
                                        detectedItems.push({
                                            _debugInput: recordJsQrSuccess(),
                                            data: cropRes.data,
                                            managementCode: cropRes.managementCode,
                                                    managementCode32: cropRes.managementCode32,
                                                    managementFlags16: cropRes.managementFlags16,
                                            creationDateTimeExt32: cropRes.creationDateTimeExt32,
